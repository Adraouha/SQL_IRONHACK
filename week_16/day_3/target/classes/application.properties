spring.application.name=cochesJPA

# URL de conexion a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/conspring1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate:
# create-drop: crea las tablas al arrancar y las borra al cerrar
# update: crea o actualiza las tablas sin borrarlas
# none: no toca la estructura de tablas (para produccion)
spring.jpa.hibernate.ddl-auto=update

# Mostrar en consola las instrucciones SQL
spring.jpa.show-sql=true

# Formatear el SQL para mejor legibilidad en consola
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de base de datos
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
